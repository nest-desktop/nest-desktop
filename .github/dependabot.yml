# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

multi-ecosystem-groups:
  python:
    schedule:
      interval: "weekly"

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    # Location of `.github/workflows` in the `root` directory
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Low risk - merge without much review
      minor-and-patch-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # # Higher risk - review more carefully
      # major-actions:
      #   patterns:
      #     - "*"
      #   update-types:
      #     - "major"

  # Node dependencies
  - package-ecosystem: "npm"
    # Lock for `package.json` and `pnpm-lock.yaml` in the `root` directory
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    groups:
      # Low risk - merge without much review
      minor-and-patch-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Pre-commit hooks
  - package-ecosystem: "pre-commit"
    # Lock for `.pre-commit-config.yaml` in the `root` directory
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Low risk - merge without much review
      minor-and-patch-pre-commit:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python dependencies
  - package-ecosystem: "pip"
    multi-ecosystem-group: python
    # Look for "pyproject.toml" in the `root` directory
    directory: "/"
    patterns: ["*"]

  # UV dependencies
  - package-ecosystem: "uv"
    multi-ecosystem-group: python
    # Look for "uv.lock" in the `root` directory
    directory: "/"
    patterns: ["*"]
