name: Electron Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12
          cache: true

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Install Electron app dependencies
        run: pnpm postinstall:electron

      - name: Build Electron app
        run: pnpm app:build --publish never

      - name: Upload Electron app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nest-desktop-linux
          path: out/linux-unpacked/
          retention-days: 14
